[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake"
version = "0.2.1"
description = "A starter second-brain vault for AI agents (Obsidian + Markdown + git), with nightly journals of what your agents did"
requires-python = ">=3.11"
dependencies = ['tzdata; sys_platform == "win32"']

[project.scripts]
wake = "wake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wake = ["prompts/*.md", "starter/**/*"]
